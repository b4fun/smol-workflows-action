name: Run smol-wf
description: Install smol-wf and run a workflow from the checked-out repository
author: b4fun
branding:
  icon: play
  color: blue

inputs:
  workflow:
    description: Workflow script path, relative to working-directory
    required: true
  provider:
    description: smol-wf agent provider (debug, codex, claude-code, opencode, or pi)
    required: false
    default: debug
  smol-wf-version:
    description: smol-wf release tag to install, or latest for the latest stable release
    required: false
    default: v0.3.4
  use-cache:
    description: Cache the installed smol-wf binary between workflow runs
    required: false
    default: 'false'
  args:
    description: Workflow arguments as a YAML mapping
    required: false
    default: '{}'
  working-directory:
    description: Directory containing the workflow script, relative to GITHUB_WORKSPACE
    required: false
    default: .
  db-path:
    description: SQLite database path; defaults to a temporary runner path
    required: false
    default: ''

outputs:
  result-file:
    description: Path to the JSON run report
    value: ${{ steps.run.outputs.result-file }}
  run-id:
    description: smol-wf run ID
    value: ${{ steps.run.outputs.run-id }}
  db-path:
    description: Path to the SQLite workflow database
    value: ${{ steps.run.outputs.db-path }}

runs:
  using: composite
  steps:
    - name: Resolve smol-wf version
      id: resolve-version
      shell: bash
      env:
        SMOL_WF_VERSION: ${{ inputs.smol-wf-version }}
      run: |
        set -euo pipefail
        if [[ "$SMOL_WF_VERSION" == "latest" ]]; then
          SMOL_WF_VERSION="$(curl -fsSL https://api.github.com/repos/b4fun/smol-workflows/releases/latest \
            | sed -n 's/^[[:space:]]*"tag_name":[[:space:]]*"\([^"]*\)".*/\1/p' \
            | head -n 1)"
          if [[ -z "$SMOL_WF_VERSION" ]]; then
            echo "Could not resolve the latest smol-wf release" >&2
            exit 1
          fi
          echo "Resolved smol-wf latest release to $SMOL_WF_VERSION"
        fi
        if [[ ! "$SMOL_WF_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "smol-wf-version must be 'latest' or a release tag such as v0.3.4" >&2
          exit 2
        fi
        echo "version=$SMOL_WF_VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache smol-wf
      uses: actions/cache@v4
      if: ${{ inputs.use-cache == 'true' }}
      with:
        path: ${{ runner.temp }}/smol-wf/bin
        key: smol-wf-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve-version.outputs.version }}-yq4.54.1-jq1.8.2

    - name: Install yq and jq
      shell: bash
      env:
        YQ_VERSION: v4.54.1
        JQ_VERSION: 1.8.2
      run: |
        set -euo pipefail
        install_dir="$RUNNER_TEMP/smol-wf/bin"
        mkdir -p "$install_dir"

        case "$RUNNER_OS:$RUNNER_ARCH" in
          Linux:X64) yq_platform=linux_amd64; jq_platform=linux-amd64 ;;
          Linux:ARM64) yq_platform=linux_arm64; jq_platform=linux-arm64 ;;
          macOS:X64) yq_platform=darwin_amd64; jq_platform=macos-amd64 ;;
          macOS:ARM64) yq_platform=darwin_arm64; jq_platform=macos-arm64 ;;
          *) echo "Unsupported runner platform: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 2 ;;
        esac

        if [[ ! -x "$install_dir/yq" ]]; then
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_${yq_platform}" \
            -o "$install_dir/yq"
          chmod +x "$install_dir/yq"
        fi
        if [[ ! -x "$install_dir/jq" ]]; then
          curl -fsSL "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-${jq_platform}" \
            -o "$install_dir/jq"
          chmod +x "$install_dir/jq"
        fi
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Install smol-wf
      shell: bash
      env:
        SMOL_WF_VERSION: ${{ steps.resolve-version.outputs.version }}
      run: |
        set -euo pipefail
        install_dir="$RUNNER_TEMP/smol-wf/bin"
        mkdir -p "$install_dir"
        if [[ ! -x "$install_dir/smol-wf" ]]; then
          curl -fsSL "https://raw.githubusercontent.com/b4fun/smol-workflows/${SMOL_WF_VERSION}/install.sh" \
            | bash -s -- --version "$SMOL_WF_VERSION" --dir "$install_dir"
        else
          echo "Using cached smol-wf $SMOL_WF_VERSION"
        fi
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Prepare workflow arguments
      shell: bash
      env:
        SMOL_WF_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        args_file="$RUNNER_TEMP/smol-wf/args.json"
        mkdir -p "$(dirname "$args_file")"
        printf '%s' "$SMOL_WF_ARGS" | yq -o=json '.' | jq -ces '
          if length == 1 and (.[0] | type == "object") then .[0]
          else error("args must be a YAML mapping")
          end
        ' > "$args_file"

    - name: Run workflow
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SMOL_WF_WORKFLOW: ${{ inputs.workflow }}
        SMOL_WF_PROVIDER: ${{ inputs.provider }}
        SMOL_WF_DB_INPUT: ${{ inputs.db-path }}
      run: |
        set -euo pipefail
        args_file="$RUNNER_TEMP/smol-wf/args.json"
        result_file="$RUNNER_TEMP/smol-wf/result.json"
        db_path="$SMOL_WF_DB_INPUT"
        if [[ -z "$db_path" ]]; then
          db_path="$RUNNER_TEMP/smol-wf/workflows.db"
        elif [[ "$db_path" != /* ]]; then
          db_path="$GITHUB_WORKSPACE/$db_path"
        fi
        mkdir -p "$(dirname "$db_path")" "$(dirname "$result_file")"

        smol-wf run "$SMOL_WF_WORKFLOW" \
          --agent-provider "$SMOL_WF_PROVIDER" \
          --db "$db_path" \
          --args-from-file "$args_file" \
          > "$result_file"

        run_id="$(jq -r '.runID // empty' "$result_file")"
        echo "result-file=$result_file" >> "$GITHUB_OUTPUT"
        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
        echo "db-path=$db_path" >> "$GITHUB_OUTPUT"
